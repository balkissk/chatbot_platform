<main class="auth-page">
  <section class="auth-panel" aria-labelledby="forgot-password-title">
    <header class="auth-header">
      <a class="auth-brand" routerLink="/" aria-label="ChatBot Factory home">
        <img src="/chatbot-factory-logo-cropped.png" alt="" width="194" height="246" decoding="async" fetchpriority="high">
        <span class="auth-brand-text" aria-hidden="true">
          <span class="auth-brand-chatbot">ChatBot</span>
          <span class="auth-brand-factory">Factory</span>
        </span>
      </a>
      <p class="eyebrow">ACCOUNT RECOVERY</p>
      <h1 id="forgot-password-title">Reset your password</h1>
      <p class="subtitle">We’ll send you a secure link to create a new password.</p>
    </header>

    <form *ngIf="!sent(); else sentState" (ngSubmit)="submit()" class="auth-form" novalidate>
      <div class="field">
        <label for="forgot-email">Email</label>
        <input
          id="forgot-email"
          #emailField="ngModel"
          [(ngModel)]="email"
          name="email"
          type="email"
          autocomplete="email"
          required
          [attr.aria-invalid]="(emailField.invalid && (emailField.touched || submitted())) ? 'true' : null"
          [attr.aria-describedby]="(emailField.invalid && (emailField.touched || submitted())) ? 'forgot-email-error' : null">
        <p *ngIf="emailField.invalid && (emailField.touched || submitted())" id="forgot-email-error" class="field-error">Enter your email address.</p>
      </div>

      <p *ngIf="error()" class="auth-alert error" role="alert">{{ error() }}</p>

      <button class="auth-submit" type="submit" [disabled]="loading() || !email">
        {{ loading() ? 'Sending...' : 'Send reset link' }}
      </button>

      <p class="auth-switch">Remembered your password? <a routerLink="/login">Sign in</a></p>
    </form>

    <ng-template #sentState>
      <div class="auth-form">
        <div class="success-block" role="status">
          <strong>Check your inbox</strong>
          <span>{{ message() }}</span>
        </div>

        <a class="login-link-button" routerLink="/login">Back to sign in</a>
      </div>
    </ng-template>

    <p class="secure-note">
      <svg lucideLockKeyhole size="15" aria-hidden="true"></svg>
      Secure workspace access
    </p>
  </section>
</main>
