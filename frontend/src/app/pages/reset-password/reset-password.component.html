<main class="auth-page">
  <section class="auth-panel" aria-labelledby="reset-password-title">
    <header class="auth-header">
      <a class="auth-brand" routerLink="/" aria-label="ChatBot Factory home">
        <img src="/logo-navbar.png" alt="ChatBot Factory" width="232" height="70" decoding="async" fetchpriority="high">
      </a>
      <p class="eyebrow">ACCOUNT RECOVERY</p>
      <h1 id="reset-password-title">Choose a new password</h1>
      <p class="subtitle">Use at least 8 characters for your new password.</p>
    </header>

    <form (ngSubmit)="submit()" class="auth-form" novalidate>
      <div class="field">
        <label for="reset-password">New password</label>
        <div class="password-control">
          <input
            id="reset-password"
            #passwordField="ngModel"
            [(ngModel)]="password"
            name="password"
            [type]="showPassword() ? 'text' : 'password'"
            autocomplete="new-password"
            required
            minlength="8"
            [attr.aria-invalid]="(passwordField.invalid && (passwordField.touched || submitted())) ? 'true' : null"
            [attr.aria-describedby]="(passwordField.invalid && (passwordField.touched || submitted())) ? 'reset-password-error' : null">
          <button
            class="password-toggle"
            type="button"
            [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
            [attr.title]="showPassword() ? 'Hide password' : 'Show password'"
            (click)="togglePasswordVisibility()">
            <svg *ngIf="!showPassword()" lucideEye size="18" aria-hidden="true"></svg>
            <svg *ngIf="showPassword()" lucideEyeOff size="18" aria-hidden="true"></svg>
          </button>
        </div>
        <p *ngIf="passwordField.invalid && (passwordField.touched || submitted())" id="reset-password-error" class="field-error">Enter at least 8 characters.</p>
      </div>

      <div class="field">
        <label for="reset-confirm-password">Confirm password</label>
        <div class="password-control">
          <input
            id="reset-confirm-password"
            #confirmPasswordField="ngModel"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            [type]="showConfirmPassword() ? 'text' : 'password'"
            autocomplete="new-password"
            required
            [attr.aria-invalid]="((confirmPasswordField.invalid && (confirmPasswordField.touched || submitted())) || passwordMismatch()) ? 'true' : null"
            [attr.aria-describedby]="((confirmPasswordField.invalid && (confirmPasswordField.touched || submitted())) || passwordMismatch()) ? 'reset-confirm-password-error' : null">
          <button
            class="password-toggle"
            type="button"
            [attr.aria-label]="showConfirmPassword() ? 'Hide confirm password' : 'Show confirm password'"
            [attr.title]="showConfirmPassword() ? 'Hide confirm password' : 'Show confirm password'"
            (click)="toggleConfirmPasswordVisibility()">
            <svg *ngIf="!showConfirmPassword()" lucideEye size="18" aria-hidden="true"></svg>
            <svg *ngIf="showConfirmPassword()" lucideEyeOff size="18" aria-hidden="true"></svg>
          </button>
        </div>
        <p *ngIf="confirmPasswordField.invalid && (confirmPasswordField.touched || submitted())" id="reset-confirm-password-error" class="field-error">Confirm your password.</p>
        <p *ngIf="passwordMismatch()" id="reset-confirm-password-error" class="field-error">Passwords do not match.</p>
      </div>

      <p *ngIf="error()" class="auth-alert error" role="alert">{{ error() }}</p>
      <p *ngIf="message()" class="auth-alert success" role="status">{{ message() }}</p>

      <button class="auth-submit" type="submit" [disabled]="loading() || !token || !password || !confirmPassword || passwordMismatch()">
        {{ loading() ? 'Resetting password...' : 'Reset password' }}
      </button>

      <p class="auth-switch" *ngIf="resetComplete()">Password updated. <a routerLink="/login">Sign in</a></p>
    </form>

    <p class="secure-note">
      <svg lucideLockKeyhole size="15" aria-hidden="true"></svg>
      Secure workspace access
    </p>
  </section>
</main>
